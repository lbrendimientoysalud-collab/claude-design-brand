<!--
  COMPONENT: Top navigation
  Sticky, glassy, con logo CD + 3 enlaces + CTA
-->
<style>
  .cd-nav {
    position: sticky; top: 0; z-index: 30;
    background: rgba(232, 233, 236, .9);
    backdrop-filter: blur(12px);
    border-bottom: var(--cd-border);
  }
  .cd-nav__inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 72px; max-width: var(--cd-container);
    margin: 0 auto; padding: 0 var(--cd-gutter);
  }
  .cd-nav__logo {
    font-family: var(--cd-font-display); font-weight: 900;
    font-size: 32px; line-height: 1; color: var(--cd-black);
    text-decoration: none; letter-spacing: -.02em;
  }
  .cd-nav__logo .dot { color: var(--cd-blue); }
  .cd-nav__links {
    display: flex; gap: 28px; align-items: center;
  }
  .cd-nav__links a {
    color: var(--cd-black); text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: color var(--cd-dur-fast) var(--cd-ease);
  }
  .cd-nav__links a:hover { color: var(--cd-blue); }
</style>

<header class="cd-nav">
  <div class="cd-nav__inner">
    <a href="/" class="cd-nav__logo">CD<span class="dot">.</span></a>
    <nav class="cd-nav__links">
      <a href="#servicios">Servicios</a>
      <a href="#trabajo">Trabajo</a>
      <a href="#proceso">Proceso</a>
      <a href="#contacto" class="cd-btn cd-btn--primary">Hablemos <span class="arrow">→</span></a>
    </nav>
  </div>
</header>
