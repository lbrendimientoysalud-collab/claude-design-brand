<!--
  COMPONENT: Instagram slide frame
  Marco base 1:1 (1080x1080) que envuelve cualquier slide de carrusel.
  Incluye:
    · Marcadores de esquina (sello de marca)
    · Top meta con monograma CD + código de slide
    · Bottom meta con marca + paginación

  Las plantillas en /templates/ extienden este frame con su contenido.
-->
<style>
  .cd-ig {
    --ig-fg: var(--cd-black);
    --ig-bg: var(--cd-gray);
    width: 1080px; height: 1080px;
    background: var(--ig-bg); color: var(--ig-fg);
    font-family: var(--cd-font-body);
    position: relative; overflow: hidden;
    padding: 64px;
  }
  .cd-ig--blue  { --ig-bg: var(--cd-blue);  --ig-fg: var(--cd-gray); }
  .cd-ig--navy  { --ig-bg: var(--cd-navy);  --ig-fg: var(--cd-gray); }
  .cd-ig--black { --ig-bg: var(--cd-black); --ig-fg: var(--cd-gray); }

  .cd-ig__cm {
    position: absolute; width: 22px; height: 22px;
    border: 2px solid var(--ig-fg);
  }
  .cd-ig__cm.tl { top: 32px; left: 32px;  border-right: 0; border-bottom: 0; }
  .cd-ig__cm.tr { top: 32px; right: 32px; border-left: 0;  border-bottom: 0; }
  .cd-ig__cm.bl { bottom: 32px; left: 32px;  border-right: 0; border-top: 0; }
  .cd-ig__cm.br { bottom: 32px; right: 32px; border-left: 0;  border-top: 0; }

  .cd-ig__top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cd-ig__monogram {
    font-family: var(--cd-font-display); font-weight: 900;
    font-size: 36px; line-height: 1; color: var(--ig-fg);
  }
  .cd-ig__code {
    font-family: var(--cd-font-mono); font-size: 14px;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--ig-fg);
  }

  .cd-ig__bottom {
    position: absolute; left: 64px; right: 64px; bottom: 64px;
    padding-top: 18px; border-top: 1.5px solid var(--ig-fg);
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--cd-font-mono); font-size: 13px;
    letter-spacing: .2em; text-transform: uppercase; color: var(--ig-fg);
  }
</style>

<!-- Frame vacío. Las plantillas insertan contenido entre <main></main>. -->
<div class="cd-ig">
  <span class="cd-ig__cm tl"></span>
  <span class="cd-ig__cm tr"></span>
  <span class="cd-ig__cm bl"></span>
  <span class="cd-ig__cm br"></span>

  <div class="cd-ig__top">
    <span class="cd-ig__monogram">CD</span>
    <span class="cd-ig__code">01 / SLIDE · ID</span>
  </div>

  <main>
    <!-- SLOT: contenido del slide -->
  </main>

  <div class="cd-ig__bottom">
    <span>CLAUDE DESIGN</span>
    <span>01 / 08</span>
  </div>
</div>
