<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IG · Cover · Hook</title>
  <link rel="stylesheet" href="../tokens/colors.css" />
  <link rel="stylesheet" href="../tokens/typography.css" />
  <link rel="stylesheet" href="../tokens/spacing.css" />
  <link rel="stylesheet" href="../components/ig-frame.html" />
  <style>
    body { background: #1d1d1d; margin: 0; padding: 32px; display: flex; justify-content: center; }

    /* Inline frame styles (importadas desde el componente para portabilidad) */
    .cd-ig { --ig-fg: var(--cd-black); --ig-bg: var(--cd-gray);
      width: 1080px; height: 1080px;
      background: var(--ig-bg); color: var(--ig-fg);
      font-family: var(--cd-font-body); position: relative;
      overflow: hidden; padding: 64px; }
    .cd-ig--blue  { --ig-bg: var(--cd-blue);  --ig-fg: var(--cd-gray); }
    .cd-ig__cm   { position: absolute; width: 22px; height: 22px; border: 2px solid var(--ig-fg); }
    .cd-ig__cm.tl{ top: 32px; left: 32px;  border-right: 0; border-bottom: 0; }
    .cd-ig__cm.tr{ top: 32px; right: 32px; border-left: 0;  border-bottom: 0; }
    .cd-ig__cm.bl{ bottom: 32px; left: 32px;  border-right: 0; border-top: 0; }
    .cd-ig__cm.br{ bottom: 32px; right: 32px; border-left: 0;  border-top: 0; }
    .cd-ig__top  { position: absolute; top: 64px; left: 64px; right: 64px;
      display: flex; align-items: center; justify-content: space-between; }
    .cd-ig__monogram { font-family: var(--cd-font-display); font-weight: 900; font-size: 36px; }
    .cd-ig__code { font-family: var(--cd-font-mono); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }
    .cd-ig__bottom { position: absolute; left: 64px; right: 64px; bottom: 64px;
      padding-top: 18px; border-top: 1.5px solid var(--ig-fg);
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--cd-font-mono); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }

    /* Specifics for Cover */
    .cover__hook {
      position: absolute; top: 220px; left: 64px; right: 64px;
      font-family: var(--cd-font-display); font-weight: 900;
      font-size: 200px; line-height: .9; text-transform: uppercase;
      letter-spacing: -.02em;
    }
    .cover__hook .underline {
      background: linear-gradient(transparent 65%, var(--cd-gray) 65%);
      color: var(--cd-blue);
      padding: 0 .1em;
    }
    .cover__sub {
      position: absolute; left: 64px; right: 64px; top: 660px;
      font-family: var(--cd-font-body); font-weight: 700;
      font-size: 26px; letter-spacing: .04em; text-transform: uppercase;
    }
    .cover__sub::before { content: ""; display: block; width: 60px; height: 2px;
      background: currentColor; margin-bottom: 16px; }
    .cover__cue {
      position: absolute; left: 64px; right: 64px; bottom: 200px;
      font-family: var(--cd-font-display); font-weight: 900;
      font-size: 56px; text-transform: uppercase;
      display: flex; align-items: center; gap: 24px;
    }
    .cover__cue .arrow { display: inline-block; }
  </style>
</head>
<body>

<div class="cd-ig cd-ig--blue">
  <span class="cd-ig__cm tl"></span><span class="cd-ig__cm tr"></span>
  <span class="cd-ig__cm bl"></span><span class="cd-ig__cm br"></span>

  <div class="cd-ig__top">
    <span class="cd-ig__monogram">CD</span>
    <span class="cd-ig__code">01 / COVER · HOOK</span>
  </div>

  <h1 class="cover__hook">
    ¿Rigidez<br/>de <span class="underline">cadera?</span>
  </h1>

  <p class="cover__sub">El test que todo futbolista debe hacer</p>

  <div class="cover__cue">
    <span class="arrow">→</span><span>Desliza</span>
  </div>

  <div class="cd-ig__bottom">
    <span>CLAUDE DESIGN</span>
    <span>01 / 08</span>
  </div>
</div>

</body>
</html>
