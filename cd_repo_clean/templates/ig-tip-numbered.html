<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IG · Tip · Numbered</title>
  <link rel="stylesheet" href="../tokens/colors.css" />
  <link rel="stylesheet" href="../tokens/typography.css" />
  <link rel="stylesheet" href="../tokens/spacing.css" />
  <style>
    body { background: #1d1d1d; margin: 0; padding: 32px; display: flex; justify-content: center; }
    .cd-ig { width: 1080px; height: 1080px; background: var(--cd-gray); color: var(--cd-black);
      font-family: var(--cd-font-body); position: relative; overflow: hidden; padding: 64px; }
    .cd-ig__cm   { position: absolute; width: 22px; height: 22px; border: 2px solid currentColor; }
    .cd-ig__cm.tl{ top: 32px; left: 32px; border-right: 0; border-bottom: 0; }
    .cd-ig__cm.tr{ top: 32px; right: 32px; border-left: 0; border-bottom: 0; }
    .cd-ig__cm.bl{ bottom: 32px; left: 32px; border-right: 0; border-top: 0; }
    .cd-ig__cm.br{ bottom: 32px; right: 32px; border-left: 0; border-top: 0; }
    .cd-ig__top { position: absolute; top: 64px; left: 64px; right: 64px;
      display: flex; align-items: center; justify-content: space-between; }
    .cd-ig__monogram { font-family: var(--cd-font-display); font-weight: 900; font-size: 36px; }
    .cd-ig__code { font-family: var(--cd-font-mono); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }
    .cd-ig__bottom { position: absolute; left: 64px; right: 64px; bottom: 64px;
      padding-top: 18px; border-top: 1.5px solid var(--cd-black);
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--cd-font-mono); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }

    .tip {
      position: absolute; top: 220px; left: 64px; right: 64px; bottom: 200px;
      display: grid; grid-template-columns: 480px 1px 1fr; gap: 64px; align-items: center;
    }
    .tip__num {
      font-family: var(--cd-font-display); font-weight: 900;
      font-size: 480px; line-height: .85; color: var(--cd-blue);
      letter-spacing: -.04em;
    }
    .tip__divider { background: var(--cd-black); width: 1.5px; height: 70%; align-self: center; }
    .tip__title {
      font-family: var(--cd-font-display); font-weight: 900;
      font-size: 88px; line-height: .92; text-transform: uppercase;
      letter-spacing: -.01em;
    }
    .tip__body {
      margin-top: 28px; font-size: 24px; line-height: 1.4; color: var(--cd-black);
    }
  </style>
</head>
<body>

<div class="cd-ig">
  <span class="cd-ig__cm tl"></span><span class="cd-ig__cm tr"></span>
  <span class="cd-ig__cm bl"></span><span class="cd-ig__cm br"></span>

  <div class="cd-ig__top">
    <span class="cd-ig__monogram">CD</span>
    <span class="cd-ig__code">02 / TIP · NUMBERED</span>
  </div>

  <div class="tip">
    <div class="tip__num">01</div>
    <div class="tip__divider"></div>
    <div>
      <h2 class="tip__title">Movilidad<br/>de cadera</h2>
      <p class="tip__body">
        Sentadilla profunda con pies paralelos durante 60 segundos. Sin perder el talón. Si no llegas, ahí tienes tu primer trabajo.
      </p>
    </div>
  </div>

  <div class="cd-ig__bottom">
    <span>CLAUDE DESIGN</span>
    <span>02 / 08</span>
  </div>
</div>

</body>
</html>
